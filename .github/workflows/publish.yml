name: publish

on:
  push:
    paths:
      - "posts/queue/**"
  schedule:
    - cron: "17 1 * * *"     # 매일 10:17 KST 한 번 더 확인 (혹시 놓친 글)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish queued posts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          DRAFT_MODE: ${{ vars.DRAFT_MODE }}
        run: python publish.py
      - name: Move published files
        if: always()
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || (git commit -m "published posts" && git pull --rebase && git push)
